# Rate-limit zones and keys for ckan.tacc.utexas.edu.
#
# Install as /etc/nginx/conf.d/00-ckan-rate-limits.conf (scripts/nginx/deploy.sh does this).
# conf.d is included in the http context, and the "00-" prefix makes this load before
# ckan-tacc-utexas.conf, which uses these zones.
#
# Design notes
#  - A request whose zone key is the empty string is NOT counted. The two maps below return
#    an empty key for requests without a query string, so plain page views (an organization
#    page, its tabs, the index) never touch the strict search zones. Only query-string requests
#    (facets, search, pagination), which are the expensive and crawlable ones, are counted.
#  - The "*_global" zones are shared by every visitor. Keep them well above what a handful of
#    people browsing at once can produce, or one crawler burst will 429 everyone.

# Empty key when there is no query string -> not counted by the search zones.
map $args $ckan_search_ip  { ""  ""; default $binary_remote_addr; }
map $args $ckan_search_all { ""  ""; default $server_name; }

limit_req_zone $binary_remote_addr zone=ckan_general:20m        rate=10r/s;
limit_req_zone $ckan_search_ip     zone=ckan_search:20m         rate=60r/m;
limit_req_zone $server_name        zone=ckan_general_global:10m rate=40r/s;
limit_req_zone $ckan_search_all    zone=ckan_search_global:10m  rate=10r/s;

limit_conn_zone $binary_remote_addr zone=ckan_connections:20m;
