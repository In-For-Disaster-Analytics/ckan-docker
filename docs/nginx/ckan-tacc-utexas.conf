# ckan.tacc.utexas.edu site config. Install as /etc/nginx/conf.d/ckan-tacc-utexas.conf
# (scripts/nginx/deploy.sh does this). Rate-limit zones live in 00-ckan-rate-limits.conf.
# The $blocked_bot variable is defined in the host's /etc/nginx/nginx.conf.
  map $http_origin $cors_origin {
      default "";

      ~^https://monorepo-mosoriobs-projects\.vercel\.app$             $http_origin;
      ~^https://monorepo-git-develop-mosoriobs-projects\.vercel\.app$ $http_origin;

      ~^https?://localhost(:[0-9]+)?$ $http_origin;
      ~^https?://mint\.local(:[0-9]+)?$ $http_origin;
      ~^https?://127\.0\.0\.1(:[0-9]+)?$ $http_origin;
      ~^https://.*\.tacc\.utexas\.edu$ $http_origin;
      ~^https://([a-z0-9-]+\.)*pods\.portals\.tapis\.io$ $http_origin;
  }
  

upstream ckan_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    server_name ckan.tacc.utexas.edu;
    # High-volume distributed crawler ranges
    deny 119.249.100.0/24;
    deny 116.179.33.0/24;

    #  Previously identified Baidu range
    
    deny 220.181.108.0/24;
    if ($blocked_bot) {
    return 403;
}
    location = /robots.txt {
      default_type text/plain;

      return 200 "User-agent: Baiduspider\nDisallow: /\n\nUser-agent: *\nDisallow: /api/\nDisallow: /revision/\nDisallow: /dataset/rate/\nDisallow: /dataset/*/history\nDisallow: /*?*\nCrawl-delay: 10\n";
  }
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    access_log /var/log/nginx/ckan.access.log;
    error_log /var/log/nginx/ckan.error.log;

    client_max_body_size 10G;
    client_body_timeout 600s;

    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn ckan_connections 8;

    ssl_certificate /etc/letsencrypt/live/ckan.tacc.utexas.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ckan.tacc.utexas.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    #
    # Static LiDAR files
    #
    location ^~ /lidar_files {
        root /corral/utexas/BCS24011/ckan/;
        autoindex on;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,Accept-Ranges" always;
    }

    #
    # Organization and group pages
    #
    # Matches:
    #   /organization/...
    #   /group/...
    #   /en/organization/...
    #   /en_AU/organization/...
    #
    # Rate limiting: only requests with a query string (facets, search, pagination) count
    # against the strict search zones, because those are the expensive, crawlable ones.
    # Plain page views (index, an organization, its tabs) are limited only by the general
    # per-client zone. See 00-ckan-rate-limits.conf.
    #
location ~ "^/(?:[a-z]{2}(?:_[A-Z]{2})?/)?(?:organization|group)(?:/|$)" {
        # Per-client protection for query-string requests.
        limit_req zone=ckan_search burst=10 nodelay;

        # Aggregate protection against distributed crawlers (query-string requests only).
        limit_req zone=ckan_search_global burst=20;

        # Generous per-client limit for everything else on these pages.
        limit_req zone=ckan_general burst=40 nodelay;

        # Reject exceptionally large, crawler-generated facet combinations.
        if ($args ~ ".{500,}") {
            return 429;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CKAN-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CKAN-API-Key" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,Accept-Ranges" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        proxy_pass http://ckan_app;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_redirect off;
    }

    #
    # Audio and video resources with Range support
    #
    location ~* \.(mp4|webm|ogg|avi|mov|wmv|flv|m4v|mp3|wav|aac|flac|m4a|wma|opus|aiff|au|ra)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range,Content-Range,Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range,Content-Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges,Content-Range,Content-Length" always;

        proxy_pass http://ckan_app;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;
        proxy_redirect off;
    }
location /dataset/ {
limit_conn ckan_connections 32;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Range, Authorization, Content-Type' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
    #
    # All remaining CKAN routes
    #
location ~ ^/(webassets|uploads|base)/ {
    limit_conn ckan_connections 40;   # generous, not the crawler-facing limit
    expires 1y;
    add_header Cache-Control "public, immutable";
    proxy_pass http://ckan_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
    location / {
        # Per-client protection.
        limit_req zone=ckan_general burst=40 nodelay;

        # Aggregate protection against distributed traffic. nodelay: requests inside the burst
        # are served immediately instead of queued, so a busy moment does not slow everyone down.
        limit_req zone=ckan_general_global burst=100 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CKAN-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CKAN-API-Key" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,Accept-Ranges" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        proxy_pass http://ckan_app;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_redirect off;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name ckan.tacc.utexas.edu;

    return 301 https://$host$request_uri;
}
